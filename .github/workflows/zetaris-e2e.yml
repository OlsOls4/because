# End-to-end run of Because against a REAL Zetaris Lightning instance.
#
# The free Zetaris Hobby tier ships as a Docker Compose bundle (7 containers, ~4 GB of images
# from zetarishackathon.azurecr.io). This job starts that bundle on a GitHub-hosted runner,
# registers Because's public sources as Lightning tables (REST tables for SEC EDGAR and ONS,
# CSV file-store tables for FRED), runs the agent over JDBC on the example questions, and
# uploads the traces, the Lightning DDL log and the compose logs as artifacts.
#
# Repository secrets (never committed):
#   ZETARIS_BUNDLE_URL     direct download URL of zetaris-platform.zip (from cloud.enterprise.zetaris.com/dashboard/download)
#   ZETARIS_ACR_USER       registry username for zetarishackathon.azurecr.io
#   ZETARIS_ACR_PASSWORD   registry password
# Optional: FRED_API_KEY (FRED via REST instead of CSV files), BECAUSE_USER_AGENT (SEC contact),
#           NVIDIA_API_KEY / GROQ_API_KEY / GEMINI_API_KEY (validated narrative).
name: zetaris-e2e

on:
  workflow_dispatch:
    inputs:
      questions:
        description: "Questions, separated by |  (blank = the four examples + a memory recall)"
        required: false
        default: ""
      channel:
        description: "Zetaris channel: jdbc | ui | auto"
        required: false
        default: "jdbc"
  push:
    branches: [zetaris-ci]

permissions:
  contents: read

concurrency:
  group: zetaris-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ZP: /tmp/zetaris-platform
      BECAUSE_DATA_DIR: /tmp/because-data
      OUT: ${{ github.workspace }}/zetaris_runs
      BECAUSE_HOME: ${{ github.workspace }}/.because
      BECAUSE_BACKEND: zetaris
      ZETARIS_CHANNEL: ${{ github.event.inputs.channel || 'jdbc' }}
      ZETARIS_JDBC_URL: jdbc:zetaris:lightning@localhost:10000
      ZETARIS_UI_URL: http://localhost:3000
      BECAUSE_ZETARIS_HYBRID: "1"
      BECAUSE_ZETARIS_FILE_DIR: /tmp/because-data
      BECAUSE_ZETARIS_FILE_URI: file:///home/zetaris/customer-data/shared/because
      BECAUSE_USER_AGENT: ${{ secrets.BECAUSE_USER_AGENT || 'because-agent-ci OlsOls4@users.noreply.github.com' }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BECAUSE_GDELT: "0"
    steps:
      - name: Check required secrets
        env:
          U: ${{ secrets.ZETARIS_BUNDLE_URL }}
          A: ${{ secrets.ZETARIS_ACR_USER }}
          P: ${{ secrets.ZETARIS_ACR_PASSWORD }}
        run: |
          missing=""
          [ -n "$U" ] || missing="$missing ZETARIS_BUNDLE_URL"
          [ -n "$A" ] || missing="$missing ZETARIS_ACR_USER"
          [ -n "$P" ] || missing="$missing ZETARIS_ACR_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          echo "all three secrets present"

      - uses: actions/checkout@v4

      - name: Free disk space (images need ~10 GB unpacked)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          docker image prune -af >/dev/null || true
          df -h /
          free -g; nproc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download and unpack the Zetaris bundle
        env:
          ZETARIS_BUNDLE_URL: ${{ secrets.ZETARIS_BUNDLE_URL }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zetaris-platform.zip" "$ZETARIS_BUNDLE_URL"
          file "$RUNNER_TEMP/zetaris-platform.zip"
          mkdir -p "$RUNNER_TEMP/zb" && unzip -q "$RUNNER_TEMP/zetaris-platform.zip" -d "$RUNNER_TEMP/zb"
          src="$(dirname "$(find "$RUNNER_TEMP/zb" -maxdepth 3 -name docker-compose.yml | head -1)")"
          mv "$src" "$ZP"
          ls -la "$ZP"
          # Runner has 16 GB / 4 cores: give the query engine more than the laptop default.
          cd "$ZP"
          sed -i 's/^ZSPARK_DRIVER_MEM=.*/ZSPARK_DRIVER_MEM=6g/; s/^ZSPARK_DRIVER_CORES=.*/ZSPARK_DRIVER_CORES=4/; s/^ZSPARK_MASTER_URL=.*/ZSPARK_MASTER_URL=local[4]/; s/^ZETARIS_API_MAX_HEAP=.*/ZETARIS_API_MAX_HEAP=2g/' .env
          grep -q '^TELEMETRY_ENABLED=' .env && sed -i 's/^TELEMETRY_ENABLED=.*/TELEMETRY_ENABLED=false/' .env
          echo "spark.sql.shuffle.partitions        8" >> conf/spark-defaults.conf
          # Local CSV files (FRED) for Lightning FILESTORE tables, visible to the driver.
          mkdir -p "$BECAUSE_DATA_DIR" && chmod 777 "$BECAUSE_DATA_DIR"
          cat > docker-compose.override.yml <<EOF
          services:
            driver:
              volumes:
                - ${BECAUSE_DATA_DIR}:/home/zetaris/customer-data/shared/because:ro
          EOF
          docker compose config --quiet

      - name: Registry login
        env:
          ACR_USER: ${{ secrets.ZETARIS_ACR_USER }}
          ACR_PASSWORD: ${{ secrets.ZETARIS_ACR_PASSWORD }}
        run: echo "$ACR_PASSWORD" | docker login zetarishackathon.azurecr.io -u "$ACR_USER" --password-stdin

      - name: Preflight
        working-directory: ${{ env.ZP }}
        run: ./preflight.sh || echo "preflight reported problems (continuing; pull is the definitive check)"

      - name: Pull images
        working-directory: ${{ env.ZP }}
        run: docker compose pull --quiet && docker images

      - name: Start Zetaris
        working-directory: ${{ env.ZP }}
        run: docker compose up -d && docker compose ps --all

      - name: Install Because (+ JDBC extra) while Zetaris boots
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -e ".[zetaris,dev]"
          pytest -q

      - name: Wait for Zetaris (verify.sh)
        working-directory: ${{ env.ZP }}
        run: |
          for i in $(seq 1 75); do
            if ./verify.sh > /tmp/verify.log 2>&1; then cat /tmp/verify.log; exit 0; fi
            echo "--- attempt $i: $(grep -c FAIL /tmp/verify.log) failing checks"; grep FAIL /tmp/verify.log || true
            sleep 20
          done
          cat /tmp/verify.log; docker compose ps --all; exit 1

      - name: Wire credentials (from the bundle .env, masked)
        run: |
          getenv() { sed -n "s/^$1=//p" "$ZP/.env" | tail -1 | sed -e 's/^"//' -e 's/"$//'; }
          u="$(getenv ZETARIS_ADMIN_EMAIL)"; p="$(getenv ZETARIS_ADMIN_PASSWORD)"
          echo "::add-mask::$p"
          echo "ZETARIS_USERNAME=${u:-admin@zetaris.com}" >> "$GITHUB_ENV"
          echo "ZETARIS_PASSWORD=$p" >> "$GITHUB_ENV"
          echo "ZETARIS_JDBC_JAR=$(ls "$ZP"/jdbc/*driver*.jar | head -1)" >> "$GITHUB_ENV"
          mkdir -p "$OUT"

      - name: Ping Zetaris (SELECT 1, SHOW LIGHTNING DATABASES)
        run: because zetaris ping | tee "$OUT/ping.json"

      - name: Register sources as Lightning tables + SchemaStore views
        run: |
          because zetaris register 2>&1 | tee "$OUT/register.log"
          because zetaris sql "SHOW LIGHTNING DATABASES" > "$OUT/show_lightning_databases.json" || true
          because zetaris sql "SHOW LIGHTNING TABLES BECAUSE_REST" > "$OUT/show_lightning_tables_rest.json" || true
          because zetaris sql "SHOW LIGHTNING TABLES BECAUSE_FILES" > "$OUT/show_lightning_tables_files.json" || true

      - name: Run the agent on Zetaris (strict, JDBC)
        env:
          QUESTIONS: ${{ github.event.inputs.questions }}
        run: |
          if [ -z "$QUESTIONS" ]; then
            QUESTIONS="Why did Intel's gross margin fall in 2024?|Why did UK inflation spike in 2022?|Why did Nvidia's revenue jump in fiscal 2024?|Why did US unemployment spike in 2020?|What do you already know about Intel's margins?"
          fi
          IFS='|' read -ra QS <<< "$QUESTIONS"
          fails=0
          for q in "${QS[@]}"; do
            s="$(python -c 'import re,sys; print(re.sub(r"[^a-z0-9]+","-",sys.argv[1].lower()).strip("-")[:60])' "$q")"
            echo "::group::$q"
            if because ask "$q" --backend zetaris --strict --md "$OUT/$s.md" --json "$OUT/$s.json"; then :; else fails=$((fails+1)); fi
            echo "::endgroup::"
          done
          python scripts/zetaris_run_summary.py "$OUT" | tee "$OUT/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          [ "$fails" = 0 ]

      - name: Collect compose logs
        if: always()
        run: |
          mkdir -p "$OUT/compose"
          cd "$ZP" 2>/dev/null || { echo "bundle never unpacked"; exit 0; }
          docker compose ps --all > "$OUT/compose/ps.txt" 2>&1 || true
          for s in postgres init driver api ui bootstrap; do docker compose logs --no-color --tail=2000 "$s" > "$OUT/compose/$s.log" 2>&1 || true; done
          cp /tmp/verify.log "$OUT/compose/verify.log" 2>/dev/null || true
          # never ship credentials
          if [ -n "${ZETARIS_PASSWORD:-}" ]; then grep -rlF "$ZETARIS_PASSWORD" "$OUT" 2>/dev/null | xargs -r sed -i "s/$ZETARIS_PASSWORD/***/g" || true; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zetaris-runs
          path: zetaris_runs/
          retention-days: 30
