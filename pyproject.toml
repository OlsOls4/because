[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "because"
version = "0.1.0"
description = "An analyst agent that answers why-questions with evidence: every claim links to the exact query and source row behind it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
zetaris = ["JayDeBeApi>=1.2.3", "JPype1>=1.5"]
dev = ["pytest>=8"]

[project.scripts]
because = "because.cli:main"

[tool.setuptools.packages.find]
include = ["because*"]

[tool.setuptools.package-data]
because = ["agent/intents.json", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits public APIs (SEC, ONS, FRED); run with -m live"]
addopts = "-m 'not live'"
